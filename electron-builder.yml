appId: us.jettnet.earthy
productName: Earthy
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# GDAL's WASM/data files must live on the real filesystem — emscripten cannot
# read them from inside the asar archive.
asarUnpack:
  - node_modules/gdal3.js/**
mac:
  category: public.app-category.utilities
  target:
    - dmg
  identity: null # no code signing for local builds
win:
  target:
    - nsis
linux:
  target:
    - AppImage
fileAssociations:
  - ext: kml
    name: KML Document
    role: Editor
  - ext: kmz
    name: KMZ Document
    role: Editor
